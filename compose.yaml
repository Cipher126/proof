services:
  migrate:
    image: proof:local
    build: .
    command: [".venv/bin/alembic", "upgrade", "head"]
    environment:
      PROOF_DATABASE_URL: postgresql+psycopg://proof:proof@database:5432/proof
    depends_on:
      database:
        condition: service_healthy
  api:
    image: proof:local
    build: .
    environment:
      PROOF_ENVIRONMENT: sandbox
      PROOF_METRICS_ENABLED: "1"
      PROOF_DATABASE_URL: postgresql+psycopg://proof:proof@database:5432/proof
    ports:
      - "127.0.0.1:18080:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    image: proof:local
    profiles: ["worker"]
    command: [".venv/bin/proof-worker"]
    environment:
      PROOF_DATABASE_URL: postgresql+psycopg://proof:proof@database:5432/proof
      PROOF_OUTBOX_URL: ${PROOF_OUTBOX_URL:-}
      PROOF_OUTBOX_TOKEN: ${PROOF_OUTBOX_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
  maintenance:
    image: proof:local
    profiles: ["retain"]
    command: [".venv/bin/python", "-m", "proof.maintenance", "--apply", "--loop"]
    environment:
      PROOF_ENVIRONMENT: sandbox
      PROOF_DEMO_RETENTION_ENABLED: "1"
      PROOF_DATABASE_URL: postgresql+psycopg://proof:proof@database:5432/proof
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observe"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:19090:9090"
  grafana:
    image: grafana/grafana:12.0.2
    profiles: ["observe"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:13001:3000"
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: proof
      POSTGRES_USER: proof
      POSTGRES_PASSWORD: proof
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proof -d proof"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - proof-postgres:/var/lib/postgresql/data

volumes:
  proof-postgres:
