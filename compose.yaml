services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: proof
      POSTGRES_USER: proof
      POSTGRES_PASSWORD: proof
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proof -d proof"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - proof-postgres:/var/lib/postgresql/data

volumes:
  proof-postgres:
