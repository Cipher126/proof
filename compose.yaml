services:
  migrate:
    image: proof:local
    build: .
    command: [".venv/bin/alembic", "upgrade", "head"]
    environment:
      PROOF_DATABASE_URL: postgresql+psycopg://proof:proof@database:5432/proof
    depends_on:
      database:
        condition: service_healthy
  api:
    image: proof:local
    build: .
    environment:
      PROOF_ENVIRONMENT: sandbox
      PROOF_DATABASE_URL: postgresql+psycopg://proof:proof@database:5432/proof
    ports:
      - "127.0.0.1:18080:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: proof
      POSTGRES_USER: proof
      POSTGRES_PASSWORD: proof
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proof -d proof"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - proof-postgres:/var/lib/postgresql/data

volumes:
  proof-postgres:
