name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: proof
          POSTGRES_USER: proof
          POSTGRES_PASSWORD: proof
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proof -d proof"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PROOF_DATABASE_URL: postgresql+psycopg://proof:proof@127.0.0.1:5432/proof
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: uv sync --frozen
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      - run: uv run alembic upgrade head
      - run: uv run pytest -o addopts="" -q
      - run: uv run python scripts/export_openapi.py --check
      - name: Smoke-test the built demo
        env:
          PROOF_ENVIRONMENT: sandbox
        run: |
          uv run uvicorn proof.main:app --host 127.0.0.1 --port 18080 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused http://127.0.0.1:18080/ready
          uv run python scripts/smoke_demo.py
