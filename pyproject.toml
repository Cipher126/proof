[project]
name = "proof-ledger"
version = "0.1.0"
description = "A fault-tolerant payment ledger and reconciliation platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6,<7",
  "pytest>=8.4,<9",
]

[project.scripts]
proof-api = "proof.main:run"
proof-worker = "proof.messaging.worker:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proof"]

[tool.pytest.ini_options]
addopts = "-q -m 'not integration'"
testpaths = ["tests"]
markers = ["integration: requires the local Proof PostgreSQL service"]

[tool.ruff]
line-length = 100
target-version = "py312"
